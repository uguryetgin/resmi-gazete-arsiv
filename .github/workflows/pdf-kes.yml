name: PDF kesitleri

# Gecmis gunlerin ★ kalemleri icin sayfa kesitlerini (kucuk PDF) doldurur; gunluk is yeni gunu
# kendisi yapar. Yapay zeka kullanmaz. PDF'ler GitHub release eklerinden indirilir; basligin
# sayfadaki yeri tesseract OCR ile bulunur (sayfadaki sari isaret).
on:
  workflow_dispatch:
    inputs:
      tarihler:
        description: "YYYYAAGG (bosluklu liste). Boş = kesiti eksik son 60 gün."
        required: false
        default: ""

concurrency:
  group: resmi-gazete
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  kes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Kes
        env:
          TARIHLER: ${{ github.event.inputs.tarihler }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-tur
          pip install --quiet requests pypdf
          python scripts/pdf_kes.py ${TARIHLER:-hepsi}
      - name: Depoya işle
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then echo "Degisiklik yok."; exit 0; fi
          git commit -m "PDF kesitleri"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
