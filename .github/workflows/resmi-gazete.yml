name: Resmî Gazete indir

on:
  schedule:
    # GitHub zamanlanmis kosumlari paylasimli kuyrukta bekletiyor (bu depoda
    # 4-5 saat gecikme olculdu), o yuzden tek slot yerine alti slot var:
    # hangisi once kosarsa gazeteyi o indirir, kalanlar "zaten islenmis"
    # deyip 20 saniyede cikar. Yuvarlak dakikalardan kacinildi (:00/:15/:30
    # kuyrugun en kalabalik oldugu anlar).
    - cron: "23 21 * * *"   # 00:23 TR (ertesi gun)
    - cron: "17 23 * * *"   # 02:17 TR
    - cron: "7 1 * * *"     # 04:07 TR
    - cron: "43 2 * * *"    # 05:43 TR
    - cron: "29 4 * * *"    # 07:29 TR
    - cron: "11 6 * * *"    # 09:11 TR (emniyet slotu)
  workflow_dispatch:
    inputs:
      tarih:
        description: "Tarih (YYYYAAGG). Boş = bugün."
        required: false
        default: ""
      yeniden:
        description: "Zaten islenmis olsa bile bastan indir (true/false)"
        required: false
        default: "false"

concurrency:
  group: resmi-gazete
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  indir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Araçları kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-tur
          pip install --quiet requests beautifulsoup4

      - name: Gazeteyi indir, metni çıkar, taranmış sayfaları OCR'la
        id: indir
        # Girdiler run icine ${{ }} ile degil env ile verilir: run metninde ifade
        # varsa GitHub tum blogu tek ifade sayar ve 21.000 karakter sinirina takilir.
        env:
          TARIH: ${{ github.event.inputs.tarih }}
          YENIDEN: ${{ github.event.inputs.yeniden }}
        run: |
          if [ -z "$TARIH" ]; then TARIH=$(TZ=Europe/Istanbul date +%Y%m%d); fi
          echo "ymd=$TARIH" >> "$GITHUB_OUTPUT"

          set +e
          RG_RELEASE_DIR="$RUNNER_TEMP/rg_release" python scripts/rg_fetch.py "$TARIH"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 20 = gazete henuz yayimlanmamis, 21 = zaten islenmis.
          # Ikisi de normal durum, is basarisiz sayilmaz.
          if [ $code -eq 20 ] || [ $code -eq 21 ]; then exit 0; fi
          exit $code

      # Ilgi alanindaki "Degisiklik Yapilmasina Dair" kalemlerinde degisen hukumlerin
      # eski/yeni hali (gazete + mevzuat.gov.tr + Bedesten). Release aciklamasina ve
      # data/.../YYYYAAGG.karsilastirma.json'a yazar; hata gunluk isi durdurmaz.
      - name: Değişikliklerin eski ve yeni halini karşılaştır
        if: steps.indir.outputs.code == '0'
        continue-on-error: true
        timeout-minutes: 8
        env:
          YMD: ${{ steps.indir.outputs.ymd }}
        run: RG_RELEASE_DIR="$RUNNER_TEMP/rg_release" python scripts/karsilastir.py "$YMD"

      # Yalniz gunluk kosumlarda (zamanlanmis ya da tarihsiz elle): gecmis gunleri
      # yeniden islemek Routine'i tetiklemesin. bekleyen.json'u degistirebildigi
      # icin depoya isleme adimindan once calisir.
      - name: İlgi alanı varsa Claude Routine'i tetikle
        if: steps.indir.outputs.code == '0' && (github.event_name == 'schedule' || github.event.inputs.tarih == '')
        continue-on-error: true
        env:
          CLAUDE_ROUTINE_URL: ${{ secrets.CLAUDE_ROUTINE_URL }}
          CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
        run: RG_RELEASE_DIR="$RUNNER_TEMP/rg_release" python scripts/routine_tetikle.py

      - name: Sonucu depoya işle
        if: steps.indir.outputs.code == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Degisiklik yok."
          else
            YMD="${{ steps.indir.outputs.ymd }}"
            git commit -m "Resmi Gazete ${YMD:6:2}.${YMD:4:2}.${YMD:0:4}"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              sleep 5
            done
          fi

      # Depoya isleme adimindan SONRA: etiket, verinin islendigi commit'i gostersin.
      # Depoyu "Watch -> Custom -> Releases" ile izleyenlere GitHub mail atar.
      - name: GitHub Release oluştur
        if: steps.indir.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D="$RUNNER_TEMP/rg_release"
          if [ ! -f "$D/etiket.txt" ]; then
            echo "Release bilgisi yok."
            exit 0
          fi
          ETIKET=$(cat "$D/etiket.txt")
          BASLIK=$(cat "$D/baslik.txt")
          shopt -s nullglob
          PDFLER=("$D"/*.pdf)
          if gh release view "$ETIKET" >/dev/null 2>&1; then
            # "yeniden" ile elle kosuldu: mevcut release guncellenir (yeniden mail gitmez)
            gh release edit "$ETIKET" --title "$BASLIK" --notes-file "$D/notlar.md"
            if [ ${#PDFLER[@]} -gt 0 ]; then
              gh release upload "$ETIKET" "${PDFLER[@]}" --clobber
            fi
          else
            gh release create "$ETIKET" "${PDFLER[@]}" --title "$BASLIK" --notes-file "$D/notlar.md"
          fi

      - name: Yayımlanmadıysa bildir
        if: steps.indir.outputs.code == '20'
        run: echo "::notice::Resmi Gazete bu calismada henuz yayimlanmamisti."

      - name: Zaten işlenmişse bildir
        if: steps.indir.outputs.code == '21'
        run: echo "::notice::Bu sayi daha onceki bir slotta islenmis, yeni mukerrer yok."
