name: GitHub Models özetleri

# Gecmis gunlerin ★ kalemleri icin otomatik ozet doldurur (gunluk is yeni gunu kendisi yapar).
# Ucretsiz kota sinirli: kota dolarsa kalan gunler bir sonraki elle kosuma kalir.
on:
  workflow_dispatch:
    inputs:
      tarihler:
        description: "YYYYAAGG (bosluklu liste). Boş = özeti eksik son 30 gün."
        required: false
        default: ""

concurrency:
  group: resmi-gazete
  cancel-in-progress: false

permissions:
  contents: write
  models: read

jobs:
  ozetle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Özetle
        env:
          TARIHLER: ${{ github.event.inputs.tarihler }}
          GITHUB_TOKEN: ${{ github.token }}
          YZ_TOKEN: ${{ secrets.YZ_TOKEN }}
        run: |
          pip install --quiet requests
          python scripts/yz_ozet.py ${TARIHLER:-hepsi}
      - name: Depoya işle
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then echo "Degisiklik yok."; exit 0; fi
          git commit -m "GitHub Models ozetleri"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
