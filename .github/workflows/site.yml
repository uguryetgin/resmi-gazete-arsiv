name: Web sayfası

# Arsivden statik sayfayi uretir, veriyi SITE_SIFRE ile sifreler ve GitHub Pages'e yayimlar
# (yapay zeka cagirmaz).
# Gunluk indirme GITHUB_TOKEN ile push ettigi icin "push" tetiklemez; bu yuzden
# indirme is akisi bitince (workflow_run) calisir.
on:
  workflow_run:
    workflows: ["Resmî Gazete indir", "GitHub Models özetleri", "PDF kesitleri"]
    types: [completed]
  push:
    branches: [main]
    paths: [scripts/sayfa.py, scripts/site_sablon.html, scripts/etiket.py, scripts/bildir.py, scripts/ozet_pdf.py, "scripts/vendor/**", ilgi.txt, etiketler.txt, etiket_duzeltme.txt, altin_kume.txt, .github/workflows/site.yml]
  workflow_dispatch:
    inputs:
      bildirim_tekrar:
        description: "Bugünün bildirimini (GitHub yorumu + özet PDF) yeniden gönder"
        type: boolean
        default: false

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write     # scripts/ozet_pdf.py: ozet PDF'i gunun release'ine eklenir
  pages: write
  id-token: write
  issues: write       # scripts/bildir.py: "Resmi Gazete hazir" bildirimi

jobs:
  yayimla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # Veri SITE_SIFRE ile sifrelenir; sifre tanimli degilse yayin durur (sifresiz yayimlanmaz).
      - name: Sayfayı üret
        env:
          SITE_SIFRE: ${{ secrets.SITE_SIFRE }}
          SITE_SIFRE_ZORUNLU: "1"
          # Sayfadaki sohbet kutusu (Gemini). Anahtar yalniz SITE_SIFRE ile sifreli veriye girer.
          SITE_YZ_TOKEN: ${{ secrets.YZ_TOKEN }}
          YZ_MODEL: ${{ vars.YZ_MODEL || 'gemini-flash-latest' }}
          YZ_YEDEK_MODELLER: ${{ vars.YZ_YEDEK_MODELLER || 'gemini-flash-lite-latest' }}
        run: |
          pip install --quiet requests cryptography
          python scripts/sayfa.py site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: dagit
        uses: actions/deploy-pages@v4

      # Gunluk bildirim (Claude Routine'in yerine): "📰 Günlük bildirim" Issue'suna depo sahibini
      # anan yorum; GitHub Mobile anlik bildirim gonderir. Ayni gun icin bir kez yazilir.
      - name: Bildirim gönder
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SAYFA_URL: ${{ steps.dagit.outputs.page_url }}
          BILDIRIM_TEKRAR: ${{ github.event.inputs.bildirim_tekrar }}
        run: python scripts/bildir.py
